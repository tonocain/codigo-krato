<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mensaje recibido | Project Krato</title>
  <meta name="robots" content="noindex" />
  <style>
    :root {
      --black: #0A0A0A;
      --near-black: #111111;
      --lime: #E8FF47;
      --white: #FFFFFF;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--black);
      color: var(--white);
      font-family: 'Trebuchet MS', Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 24px;
    }
    .k {
      width: 64px; height: 64px;
      background: var(--lime);
      color: var(--near-black);
      font-weight: 700;
      font-size: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 32px;
    }
    h1 {
      font-size: clamp(32px, 5vw, 56px);
      margin-bottom: 16px;
      line-height: 1.1;
    }
    h1 span { color: var(--lime); }
    p {
      font-size: 17px;
      color: var(--white);
      max-width: 420px;
      line-height: 1.65;
      margin-bottom: 40px;
    }
    a {
      background: var(--lime);
      color: var(--near-black);
      font-family: 'Trebuchet MS', Helvetica, Arial, sans-serif;
      font-weight: 700;
      font-size: 12px;
      letter-spacing: 4px;
      text-transform: uppercase;
      padding: 16px 32px;
      text-decoration: none;
      transition: opacity 0.2s;
    }
    a:hover { opacity: 0.85; }
  </style>
</head>
<body>
  <div class="k">K</div>
  <h1>Mensaje<br /><span>recibido.</span></h1>
  <p>Te respondemos en menos de 24 horas con una propuesta para tu negocio.</p>
  <a href="/">Volver al inicio</a>
</body>
</html>
