<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mensaje recibido | Krato Recorridos</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='32' fill='%23FF385C'/%3E%3Ctext x='32' y='43' font-family='Arial,sans-serif' font-size='30' font-weight='700' fill='%23FFFFFF' text-anchor='middle'%3EK%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --canvas: #ffffff; --ink: #222222; --body: #3f3f3f; --muted: #6a6a6a; --rausch: #ff385c; --rausch-active: #e00b41; --on-primary: #ffffff; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--canvas); color: var(--body);
      font-family: 'Inter', -apple-system, Arial, sans-serif;
      min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; justify-content: center; text-align: center;
      padding: 40px 24px;
    }
    .mark { width: 52px; height: 52px; border-radius: 50%; background: var(--rausch); color: var(--on-primary); font-family: 'Inter', sans-serif; font-weight: 700; font-size: 22px; display: flex; align-items: center; justify-content: center; margin: 0 auto 28px; }
    h1 { font-family: 'Inter', sans-serif; font-weight: 600; color: var(--ink); font-size: clamp(28px, 5vw, 42px); margin-bottom: 14px; line-height: 1.2; letter-spacing: -0.01em; }
    h1 span { color: var(--rausch); }
    p { font-size: 15.5px; color: var(--muted); max-width: 380px; line-height: 1.65; margin-bottom: 36px; }
    a { background: var(--rausch); color: var(--on-primary); font-family: 'Inter', sans-serif; font-weight: 600; font-size: 15px; padding: 14px 28px; border-radius: 8px; text-decoration: none; transition: background 0.2s; }
    a:hover { background: var(--rausch-active); }
  </style>
</head>
<body>
  <div class="mark">K</div>
  <h1>Mensaje <span>recibido</span>.</h1>
  <p>Te respondemos en menos de 24 horas con los siguientes pasos para tu recorrido.</p>
  <a href="/recorridos">Volver</a>
</body>
</html>
